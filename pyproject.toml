[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-facts-reconcile"
version = "0.1.0"
description = "Facts library reconciliation diff engine for Lost Collective series."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
lc-facts-reconcile = "lc_facts_reconcile.cli:main"
lc-coverage-audit = "lc_facts_reconcile.coverage_cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: live API tests, require credentials (skipped by default; run with `pytest -m integration`)",
]
